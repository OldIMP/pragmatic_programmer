naming:
  ConstructorParameterNaming:
    # Intentional snake_cases since that's the whole purpose
    excludes: &intentional_snake_case '**/exercise_12/test_data/expected/kotlin/**/*.kt'
  FunctionNaming:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
